.rh{text-align:center;text-transform:uppercase;letter-spacing:.06em}
.rc{display:flex;align-items:center;justify-content:flex-start;gap:8px;min-width:0;overflow:hidden;height:var(--rc-h);padding:0 var(--sp-4) 0 var(--sp-3);
  border-radius:var(--r-pill);background:var(--card);color:var(--text);font-size:min(var(--cf,99px),var(--rc-fs));font-weight:600;white-space:nowrap;
  box-shadow:var(--shadow);transition:transform .15s,background .15s,box-shadow .15s}
.rce{font-size:var(--rce);letter-spacing:-2px}
#read.tight .rce{display:none}
#rC.tall .rc{flex-direction:column;justify-content:center;height:auto;padding:4px 8px;gap:0;border-radius:var(--r-sm);white-space:normal;text-align:center;line-height:1.1}
#rC.tall .rce{font-size:18px}
.rc.none{background:transparent;box-shadow:inset 0 0 0 2px var(--line);color:var(--muted);font-size:14px;justify-content:center;cursor:default;white-space:normal;text-align:center;line-height:1.1;padding:0 8px}
#act{position:fixed;left:50%;bottom:calc(var(--bot) + var(--nav-gap));transform:translateX(-50%);z-index:var(--z-float)}

#infotitle{flex:1;font-size:var(--fs-l);font-weight:700}
#infolist{flex:1;display:flex;flex-direction:column;gap:var(--sp-3);width:100%}
.inf{display:flex;align-items:center;gap:14px;text-align:left;padding:var(--inf-pad);border-radius:var(--r);background:var(--card);color:var(--text);
  font-size:var(--inf-fs);font-weight:500;line-height:1.3;transition:background .2s,box-shadow .2s}
.ie{font-size:var(--inf-pic);flex:0 0 auto}
#infofoot{display:flex;justify-content:center;padding-top:12px}
#ixbody{flex:1;min-height:0;display:flex;gap:var(--sp-2)}
#ixgrid{position:relative;flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:var(--sp-3);align-content:start;padding-bottom:20px}
.ixh{grid-column:1/-1;display:flex;align-items:baseline;gap:var(--sp-3);padding:var(--sp-3) var(--sp-1) 0}
.ixh b{font-size:var(--fs-xl);line-height:1}
.ix{height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-2);padding-top:2px;border-radius:var(--r-sm);
  background:var(--card);color:var(--text);font-size:38px;font-weight:700;line-height:1.15;box-shadow:var(--shadow)}
.ix small{font-size:14px;font-weight:500;color:var(--muted)}
#ixaz{flex:0 0 28px;display:flex;flex-direction:column;justify-content:stretch;align-items:center;padding:8px 0;border-radius:var(--r-pill);background:var(--card);
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.az{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;width:24px;padding:1px 0;border-radius:var(--r-pill);font-size:var(--az-fs);font-weight:700;line-height:1;text-align:center;color:var(--muted);transition:background .15s,color .15s,transform .15s}
.az.dim{opacity:.55}
.az.on{background:var(--amber);color:var(--amber-ink);transform:scale(1.25)}
.sbox{flex:1;min-width:var(--sbox-min);justify-content:flex-start;gap:var(--sp-3);color:var(--muted);font-size:18px;text-align:left}
.sbox i{flex:0 0 auto;font-style:normal} .sbox span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbox:focus-within{box-shadow:var(--ring),var(--shadow);cursor:text}
#sq{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--text);font:inherit;font-size:var(--fs-m);-webkit-appearance:none;appearance:none}
#sq::-webkit-search-cancel-button{display:none}
#smeta{padding:12px 6px 8px;min-height:20px}
#sres{flex:1;display:flex;flex-direction:column;gap:var(--sp-3);padding-bottom:20px}
.sr{display:flex;align-items:center;gap:14px;min-height:76px;padding:10px 14px;border-radius:var(--r);background:var(--card);color:var(--text);text-align:left;box-shadow:var(--shadow)}
.srp{flex:0 0 56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);background:var(--card2);font-size:var(--fs-xl);--dot:34px}
.srp b{font-size:var(--fs-xl)}
.srt{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--sp-1)}
.srt b{font-size:var(--fs-l);line-height:1.1}
.srt small{font-size:var(--fs-s);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr mark{background:none;color:var(--amber);font-weight:700}
.srk{flex:0 0 auto;opacity:.85;padding:var(--sp-1)}
.ico-s{--icon:22px}
.shint{color:var(--muted);text-align:center;font-size:16px;line-height:1.4;padding:24px 20px}

#install-bar{position:fixed;top:0;left:0;right:0;z-index:var(--z-toast);display:flex;align-items:center;justify-content:center;gap:12px;padding:var(--bar-pad) var(--gut) 10px;background:var(--card)}
#install-msg{font-size:14px}
#ver{grid-column:1/-1;justify-self:center;font-weight:400;opacity:.5}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bar">
  <div id="flags" class="group"></div>
  <div id="ages" class="group" role="radiogroup"></div>
  <button id="barback" class="pill accent" data-aria="back" hidden></button>
  <button id="gridbtn" class="rbtn accent" data-aria="index" data-icon="grid" hidden></button>
  <div id="stars" class="pill" hidden></div>
</div>

<div id="stage">
  <div id="hub" class="scroll" hidden></div>
  <div id="learn" hidden>
    <div id="glyph"></div>
    <div id="pics"></div>
    <div id="word"></div>
    <div id="examples"></div>
    <div id="links" class="links"></div>
  </div>
  <div id="play" hidden>
    <div id="ask"></div>
    <div id="choices"></div>
    <div id="plinks" class="links"></div>
  </div>
  <div id="read" hidden></div>
</div>
<div id="count" class="scroll" hidden>
  <div id="ctools">
    <button id="c-obj" class="pill on" data-aria="objects" data-icon="objects"></button>
    <button id="c-hand" class="pill" data-aria="fingers" data-icon="fingers"></button>
  </div>
  <div id="crows"></div>
</div>
<button class="pill nav" id="prev" data-aria="prev" data-low hidden></button>
<button class="pill nav" id="next" data-aria="next" data-low hidden></button>
<button id="act" class="rbtn primary" data-aria="play" data-icon="play" data-low hidden></button>
<div id="info" class="sheet" role="dialog" aria-modal="true" aria-labelledby="infotitle" hidden>
  <div class="sheet-head"><span id="infotitle"></span><button id="infoclose" class="rbtn" data-aria="close" data-icon="close"></button></div>
  <div id="infolist" class="scroll"></div>
  <div id="infofoot"><button id="infoplay" class="rbtn primary" data-aria="play" data-icon="play"></button></div>
</div>
<div id="index" class="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-head"><button id="ixsearch" class="pill sbox"><i data-icon="search"></i><span></span></button><div id="ixmode" class="group" hidden><button class="seg txt" data-m="az"></button><button class="seg txt" data-m="grp"></button></div><button id="ixclose" class="rbtn" data-aria="close" data-icon="close"></button></div>
  <div id="ixbody"><div id="ixgrid" class="scroll"></div><div id="ixaz" hidden></div></div>
</div>
<div id="search" class="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-head"><div class="pill sbox"><i data-icon="search"></i><input id="sq" type="search" data-aria="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"><button id="sqclear" class="rbtn small" data-aria="clear" data-icon="close" hidden></button></div><button id="sclose" class="rbtn" data-aria="close" data-icon="close"></button></div>
  <div id="smeta" class="label"></div>
  <div id="sres" class="scroll"></div>
</div>
<nav id="tabs"></nav>
<canvas id="fx"></canvas>

<div id="install-bar" hidden>
  <span id="install-msg"></span>
  <button id="install-btn" class="pill primary small" data-text="installBtn"></button>
  <button id="dismiss-btn" class="rbtn small" data-aria="dismiss" data-icon="close"></button>
</div>

<script src="abc/manifest.js"></script>
<script>
(function () {
  var M = self.MANIFEST;
  M.scripts.forEach(function (src) {
    var e = document.createElement('script');
    e.src = src + '?v=' + M.version; e.async = false;
    document.body.appendChild(e);
  });
})();
</script>
</body>
</html>
