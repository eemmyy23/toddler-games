<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ABC 123! 🔤</title>
<link rel="icon" href="abc-icon-192.png" type="image/png">
<link rel="manifest" href="manifest-abc.json">
<meta name="theme-color" content="#090c1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ABC 123!">
<link rel="apple-touch-icon" href="abc-icon-192.png">
<style>
/* Fredoka (OFL), self-hosted so it works offline */
@font-face{font-family:'Fredoka';font-weight:400 700;font-display:swap;src:url(fonts/fredoka-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Fredoka';font-weight:400 700;font-display:swap;src:url(fonts/fredoka-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* Night theme: deep navy, warm muted accents, no white surfaces (bedtime / tent friendly) */
:root{
  --bg0:#090c1f; --bg1:#11163a; --card:#1a2050; --card2:#232a63; --line:rgba(255,255,255,.07);
  --text:#efe6d6; --muted:#9e98bf; --amber:#f0b24a; --amber-ink:#2b1d02; --amber-soft:rgba(240,178,74,.16);
  --font:'Fredoka',ui-rounded,'Nunito','Segoe UI',system-ui,sans-serif;
  --r:22px; --top:122px; --bot:calc(78px + env(safe-area-inset-bottom));
  --shadow:0 6px 18px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{color:var(--text);font-family:var(--font);background:var(--bg0);
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,240,200,.55),transparent 60%),
    radial-gradient(1.5px 1.5px at 78% 9%,rgba(255,240,200,.45),transparent 60%),
    radial-gradient(1px 1px at 46% 31%,rgba(255,240,200,.4),transparent 60%),
    radial-gradient(1px 1px at 88% 44%,rgba(255,240,200,.35),transparent 60%),
    radial-gradient(1.5px 1.5px at 22% 66%,rgba(255,240,200,.3),transparent 60%),
    radial-gradient(ellipse at 50% 0%,#1b2156 0%,transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg0))}
body[data-mode=count],body[data-mode=read]{--top:70px}
button{font-family:var(--font)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}

/* Top bar: flags + stars, then the set switcher */
#bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px;padding:max(10px,env(safe-area-inset-top)) 12px 6px}
.brk{flex-basis:100%;height:0}
.group{display:flex;gap:6px;background:var(--card);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
#flags{gap:6px}
.flag{border:none;background:transparent;border-radius:999px;width:52px;height:44px;font-size:26px;line-height:1;cursor:pointer;touch-action:manipulation;opacity:.5;filter:saturate(.7);transition:opacity .15s,background .15s}
.flag.on{opacity:1;filter:none;background:var(--amber-soft);box-shadow:inset 0 0 0 2px var(--amber)}
#stars{margin-left:auto;background:var(--card);border-radius:999px;height:54px;padding:0 16px;display:flex;align-items:center;gap:6px;font-size:22px;font-weight:600;box-shadow:var(--shadow)}
#setgrp{margin:0 auto}
body[data-mode=count] #setgrp,body[data-mode=read] #setgrp,body[data-mode=count] .brk,body[data-mode=read] .brk{display:none}
.tbtn{border:none;border-radius:999px;min-width:64px;height:46px;padding:0 16px;font-size:21px;font-weight:600;color:var(--text);background:transparent;cursor:pointer;touch-action:manipulation}
.tbtn.on{background:var(--amber);color:var(--amber-ink)}

/* Bottom tab bar, like a regular app */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;height:var(--bot);padding:6px 8px env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:flex-start;background:rgba(13,17,44,.94);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.tab{flex:1;max-width:120px;height:64px;border:none;border-radius:20px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;touch-action:manipulation}
.tab .ti{font-size:28px;line-height:1;filter:saturate(.75)}
.tab .tl{font-size:13px;font-weight:600}
.tab.on{background:var(--amber-soft);color:var(--amber)}
.tab.on .ti{filter:none;transform:scale(1.08)}

#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--top) 12px calc(var(--bot) + 12px)}
body[data-mode=learn] #stage{padding-bottom:calc(var(--bot) + 100px)}
body[data-mode=read] #stage{padding-bottom:calc(var(--bot) + 96px)}

/* Learn */
#learn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:1.6vh}
#glyph{font-size:min(28vh,46vw);line-height:1.1;font-weight:700;cursor:pointer;text-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .15s}
#glyph.grp{font-size:min(22vh,26vw)}
#glyph small{font-size:.5em;opacity:.85;margin-left:.06em}
#glyph.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
#word{font-size:min(6vh,8vw);font-weight:600;text-align:center;min-height:1.2em}
#pics{font-size:min(7vh,9vw);text-align:center;max-width:94vw;line-height:1.2;min-height:1.2em;letter-spacing:.05em}
#pics span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6%)}}
#examples{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:640px}
.ex{border:none;background:var(--card);border-radius:var(--r);min-width:96px;padding:10px 12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text);cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow);transition:transform .15s,background .15s}
.ex .ep{font-size:40px;line-height:1.1}
.ex .ew{font-size:19px;font-weight:500;white-space:nowrap}
.ex .ew b{font-weight:700}
.ex.lit{background:var(--card2);transform:translateY(-4px) scale(1.04)}
.nav{position:fixed;bottom:calc(var(--bot) + 12px);z-index:4;min-width:112px;height:72px;padding:0 18px;border-radius:999px;border:none;background:var(--card);color:var(--muted);font-size:24px;cursor:pointer;touch-action:manipulation;white-space:nowrap;box-shadow:var(--shadow)}
.nav b{font-size:40px;font-weight:700;vertical-align:middle}
.nav:active{background:var(--card2)}
#prev{left:12px}#next{right:12px}

/* Play */
#play{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:4vh}
#ask{font-size:min(5.5vh,7.5vw);font-weight:600;display:flex;align-items:center;gap:.4em;cursor:pointer;background:var(--card);padding:.25em .4em .25em .6em;border-radius:999px;box-shadow:var(--shadow)}
#ask b{display:inline-block;background:var(--amber);color:var(--amber-ink);border-radius:.4em;padding:0 .35em;font-weight:700}
#choices{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:min(4vw,4vh);max-width:96vw}
.bub{--s:min(28vh,40vw);--c:#7fb4ff;width:var(--s);height:var(--s);border-radius:50%;border:none;font-weight:700;font-size:calc(var(--s)*.56);color:#14183a;cursor:pointer;touch-action:manipulation;
  background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 72%,#000) 100%);
  box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 -8px 0 rgba(0,0,0,.12);animation:float 4s ease-in-out infinite}
.n3 .bub{--s:min(25vh,28vw)}
.n4 .bub{--s:min(21vh,21vw)}
@media (orientation:portrait){#choices.n4{display:grid;grid-template-columns:repeat(2,auto)}#choices.n4 .bub{--s:min(21vh,36vw)}}
#choices.grp .bub{font-size:calc(var(--s)*.34)}
@keyframes float{50%{transform:translateY(-6px)}}
.bub.wrong{animation:wobble .5s}
@keyframes wobble{25%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
.bub.right{animation:burst .5s forwards}
@keyframes burst{50%{transform:scale(1.2)}100%{transform:scale(0);opacity:0}}

/* Count */
#count{display:none;position:absolute;left:0;right:0;top:var(--top);bottom:var(--bot);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:0 10px 20px}
#ctools{position:sticky;top:0;z-index:2;display:flex;justify-content:center;gap:10px;padding:6px 0 12px;background:linear-gradient(var(--bg1) 75%,transparent)}
#ctools button{border:none;border-radius:999px;height:52px;padding:0 20px;font-size:24px;font-weight:600;color:var(--text);background:var(--card);cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow)}
#ctools button.on{background:var(--amber);color:var(--amber-ink)}
.crow{display:flex;align-items:center;gap:12px;margin:0 auto 10px;max-width:900px;padding:8px 12px;border-radius:var(--r);background:var(--card);cursor:pointer;transition:background .2s,transform .2s}
.crow.active{background:var(--card2);box-shadow:inset 0 0 0 2px var(--amber);transform:scale(1.02)}
.cnum{flex:0 0 auto;width:96px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.cdig{font-size:54px;font-weight:700;line-height:1}
.citems{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 6px;font-size:34px;line-height:1.1;min-height:60px}
.citem{display:inline-block;text-align:center}
.citems.obj{display:grid;grid-template-columns:repeat(5,1fr);gap:6px 10px;align-items:center}
.hand{width:84px;height:96px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.crow.active .citem,.crow.active .hand{animation:wig .7s ease}
@keyframes wig{30%{transform:translateY(-8px) rotate(-5deg)}60%{transform:translateY(-3px) rotate(4deg)}}
.cword{font-size:19px;font-weight:600;color:var(--text);opacity:.9;white-space:nowrap}

/* Read: word → letters, small letters, syllables, whole word */
#read{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:1.6vh}
#rpic{font-size:min(14vh,24vw);line-height:1.1;cursor:pointer}
.rrow{display:flex;flex-wrap:nowrap;justify-content:center;gap:6px;max-width:100%}
.rt{border:none;flex:0 1 54px;min-width:34px;height:58px;border-radius:16px;background:var(--card);color:var(--text);font-size:32px;font-weight:600;cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow);transition:transform .15s,background .15s,box-shadow .15s}
.rrow.syl .rt{flex:0 1 auto;min-width:72px;padding:0 16px}
.rt.word{flex:0 1 auto;padding:0 26px;font-size:36px;height:64px;color:var(--amber)}
.rt.lit{background:var(--card2);box-shadow:inset 0 0 0 2px var(--amber),var(--shadow);transform:translateY(-4px) scale(1.06)}
.rsep{align-self:center;color:var(--muted);font-size:26px}
#rnav{position:fixed;left:0;right:0;bottom:calc(var(--bot) + 12px);z-index:4;display:none;justify-content:space-between;align-items:center;padding:0 12px}
#rnav .nav{position:static}
#rnav .nav b{font-size:36px}
#rplay{width:76px;height:76px;border-radius:50%;border:none;background:var(--amber);color:var(--amber-ink);font-size:34px;cursor:pointer;touch-action:manipulation;box-shadow:0 8px 22px rgba(0,0,0,.45)}

#install-bar{position:fixed;top:0;left:0;right:0;z-index:10;display:none;align-items:center;justify-content:center;gap:12px;padding:10px 16px;background:var(--card);color:var(--text)}
#install-bar button{border:none;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:600;cursor:pointer}
#install-btn{background:var(--amber);color:var(--amber-ink)}
#dismiss-btn{background:transparent;color:var(--muted);font-size:20px}
#install-msg{font-size:14px}
#ver{position:fixed;bottom:calc(var(--bot) + 2px);right:8px;color:rgba(239,230,214,.25);font:11px sans-serif;pointer-events:none;z-index:4}

@media (max-width:440px){
  #bar{padding-left:8px;padding-right:8px}
  .flag{width:46px}
  .tbtn{min-width:56px;padding:0 12px;font-size:19px}
  .cnum{width:76px}.cdig{font-size:44px}.cword{font-size:16px}.citems{font-size:26px;min-height:48px}.hand{width:68px;height:78px}
  .rt{height:52px;font-size:28px}.rt.word{font-size:32px;height:58px}
  .ex{min-width:88px;padding:8px 10px 6px}.ex .ep{font-size:34px}.ex .ew{font-size:17px}
}
@media (max-height:700px){
  #glyph{font-size:min(24vh,42vw)}
  .rt{height:46px;font-size:26px}.rt.word{height:52px}#rpic{font-size:11vh}
  .ex .ep{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="bar">
  <div id="flags" class="group">
    <button class="flag" data-lang="en" aria-label="English">🇬🇧</button>
    <button class="flag" data-lang="ro" aria-label="Română">🇷🇴</button>
    <button class="flag" data-lang="de" aria-label="Deutsch">🇩🇪</button>
  </div>
  <div id="stars">⭐ 0</div>
  <div class="brk"></div>
  <div class="group" id="setgrp">
    <button class="tbtn on" id="s-abc">ABC</button>
    <button class="tbtn" id="s-123">123</button>
    <button class="tbtn" id="s-grp" aria-label="Grupuri de litere">ghi</button>
  </div>
</div>

<div id="stage">
  <div id="learn">
    <div id="glyph"></div>
    <div id="pics"></div>
    <div id="word"></div>
    <div id="examples"></div>
  </div>
  <div id="play">
    <div id="ask"></div>
    <div id="choices"></div>
  </div>
  <div id="read"></div>
</div>
<div id="count">
  <div id="ctools">
    <button id="c-obj" class="on" aria-label="Objects">🍓</button>
    <button id="c-hand" aria-label="Fingers">✋</button>
    <button id="c-all" aria-label="Count all">▶ 1→10</button>
  </div>
  <div id="crows"></div>
</div>
<button class="nav" id="prev" aria-label="Previous">◀</button>
<button class="nav" id="next" aria-label="Next">▶</button>
<div id="rnav">
  <button class="nav" id="rprev" aria-label="Previous word"></button>
  <button id="rplay" aria-label="Play">▶</button>
  <button class="nav" id="rnext" aria-label="Next word"></button>
</div>
<nav id="tabs">
  <button class="tab" id="m-learn"><span class="ti">📖</span><span class="tl"></span></button>
  <button class="tab" id="m-play"><span class="ti">🎈</span><span class="tl"></span></button>
  <button class="tab" id="m-count"><span class="ti">🧮</span><span class="tl"></span></button>
  <button class="tab" id="m-read"><span class="ti">📚</span><span class="tl"></span></button>
</nav>
<canvas id="fx"></canvas>

<div id="install-bar">
  <span id="install-msg"></span>
  <button id="install-btn">Install App</button>
  <button id="dismiss-btn">&times;</button>
</div>
<div id="ver">v0.6.0</div>

<script>
// ====== DATA ======
// Letter rows: [letter, word, emoji, like?]  like=true → letter is inside the word, not first ("X like in fox")
const LANGS = {

    showWord: (w, like) => like ? `like in ${w}` : w,
    find: 'Find',

    cheers: ['Yay!', 'Great job!', 'You did it!', 'Super!', 'Hooray!'],
    wow: n => `Well done! You have ${n} stars!`
  },
  ro: {

      H: [['hamster','🐹'],['hartă','🗺️']], I: [['iarbă','🌿'],['insulă','🏝️']], Î: [['înger','👼']],
      J: [['jaguar','🐆'],['jachetă','🧥']], K: [['kiwi','🥝'],['karate','🥋']], L: [['lămâie','🍋'],['lună','🌙']],
      M: [['maimuță','🐒'],['mașină','🚗']], N: [['nas','👃']], O: [['oaie','🐑'],['ochelari','👓']],
      P: [['pisică','🐱'],['pantof','👞']], R: [['rachetă','🚀'],['robot','🤖']], S: [['stea','⭐'],['sanie','🛷']],

      U: [['umbrelă','☂️'],['unicorn','🦄']], V: [['vacă','🐄'],['vulpe','🦊']], Y: [['yo-yo','🪀']],

  $('rnav').style.display = mode === 'read' ? 'flex' : 'none';
  $('count').style.display = mode === 'count' ? 'block' : 'none';
  $('stage').style.display = mode === 'count' ? 'none' : 'flex';
  $('prev').style.display = $('next').style.display = mode === 'learn' ? 'block' : 'none';
  stopCount(); readTok++;
  if (mode === 'learn') showLearn(started);
  else if (mode === 'play') { if (keepRound && target) drawRound(); else { target = null; newRound(); } }
  else if (mode === 'read') renderRead(started);
  else renderCount();
}
// ====== READ MODE ======
// One word with its picture, shown 4 ways: CAPITALS letter by letter, small letters (first capital),
// syllables, and the whole word. Every tile is tappable; ▶ plays it all in order.
let readIdx = Math.min(store.get('ridx', 0), READ_PICS.length - 1);
let readTok = 0;
const capFirst = (w, t) => w.charAt(0).toLocaleUpperCase(t) + w.slice(1);
function readData() {
  const L = LANGS[lang], t = L.tts, syl = L.read[readIdx].split('-');
  const word = syl.join('');
  return { L, t, syl, word, pic: READ_PICS[readIdx], shown: capFirst(word, t) };
}
function letterSay(ch) { // how one letter is spoken (RO: school sounds bî, cî …; EN/DE: the letter)
  const L = LANGS[lang], up = ch.toLocaleUpperCase(L.tts);
  return L.spell ? L.spell(up) : up;
}
function letterInk(ch) {
  const L = LANGS[lang], up = ch.toLocaleUpperCase(L.tts);
  const it = SETS.abc.find(x => x.ch === up);
  return it ? ink(it.hue) : 'var(--text)';
}
function renderRead(sayIt = true) {
  const { t, syl, word, pic, shown } = readData();
  const chars = Array.from(word);
  const tile = (txt, say, cls = '', color = '') =>
    `<button class="rt ${cls}" data-say="${esc(say)}"${color ? ` style="color:${color}"` : ''}>${esc(txt)}</button>`;
  const upper = chars.map(c => tile(c.toLocaleUpperCase(t), letterSay(c), 'u', letterInk(c))).join('');
  const lower = Array.from(shown).map(c => tile(c, letterSay(c), 'l', letterInk(c))).join('');
  const syls = syl.map((sy, i) => (i ? '<span class="rsep">·</span>' : '') +
    tile(i === 0 ? capFirst(sy, t) : sy, sy, 's', INK[(i * 3 + 4) % 8])).join('');
  $('read').innerHTML =
    `<div id="rpic" data-say="${esc(word)}">${pic}</div>` +
    `<div class="rrow" id="rU">${upper}</div>` +
    `<div class="rrow" id="rL">${lower}</div>` +
    `<div class="rrow syl" id="rS">${syls}</div>` +
    `<div class="rrow" id="rW">${tile(shown, word, 'word')}</div>`;
  const n = READ_PICS.length;
  $('rprev').innerHTML = `‹ <b>${READ_PICS[(readIdx - 1 + n) % n]}</b>`;
  $('rnext').innerHTML = `<b>${READ_PICS[(readIdx + 1) % n]}</b> ›`;
  store.set('ridx', readIdx);
  if (sayIt) speak(word, 150);
}
function lightTile(el) {
  document.querySelectorAll('#read .lit').forEach(x => x.classList.remove('lit'));
  if (el) el.classList.add('lit');
}
$('read').addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-say]'); if (!el) return;
  e.stopPropagation(); firstTouch(); readTok++;
  lightTile(el.classList.contains('rt') ? el : null);
  sfx.pop(); speak(el.dataset.say, 60);
});
// ▶: spell in capitals letter by letter → small letters (whole word) → syllables → whole word
async function playRead() {
  const tok = ++readTok;
  const alive = () => tok === readTok && mode === 'read';
  const { word } = readData();
  for (const el of document.querySelectorAll('#rU .rt')) {
    if (!alive()) return; lightTile(el); await speak(el.dataset.say); await wait(150);
  }
  if (!alive()) return; await wait(300);
  document.querySelectorAll('#read .lit').forEach(x => x.classList.remove('lit'));
  document.querySelectorAll('#rL .rt').forEach(x => x.classList.add('lit'));
  await speak(word); if (!alive()) return; await wait(300);
  for (const el of document.querySelectorAll('#rS .rt')) {
    if (!alive()) return; lightTile(el); await speak(el.dataset.say); await wait(200);
  }
  if (!alive()) return; await wait(300);
  const w = document.querySelector('#rW .rt'); lightTile(w);
  sfx.right(); await speak(word, 350);
  if (!alive()) return;
  const r = w.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top, 40, 8);
  setTimeout(() => { if (alive()) lightTile(null); }, 800);
}
function readStep(d) {
  const n = READ_PICS.length;
  readIdx = (readIdx + d + n) % n; readTok++;
  sfx.pop(); renderRead(true);
}
// Same item in another language: exact letter, else its base letter (Ș→S, Ä→A, ß→S); numbers by value.
function mapItem(it, list) {
  if (!it) return null;
  if (it.n) return list.find(x => x.n === it.n) || null;
  const base = it.ch === 'ß' ? 'S' : it.ch.normalize('NFD').replace(/\p{M}/gu, '');
  return list.find(x => x.ch === it.ch) || list.find(x => x.ch === base) || null;
}
// ====== COUNT MODE ======
// One page with 1–10 as objects or fingers. Tap a row → says that number once.
// ▶ 1→10 → goes row by row saying each number.
let countStyle = store.get('cstyle', 'obj'); // 'obj' | 'hand'
let countTimers = [];
function stopCount() {
  countTimers.forEach(clearTimeout); countTimers = [];
  document.querySelectorAll('.crow.active').forEach(r => r.classList.remove('active'));
}
function sayNow(text) { // queue a short utterance without cancelling the previous one
  if (!('speechSynthesis' in window)) return;
  clearTimeout(speakTimer);
  speechSynthesis.speak(makeUtt(text, 1, null));
}
// Cartoon hand, seen from the child's side (back of the hand): LEFT hand has the thumb on the right;
// the RIGHT hand is its mirror image, so both thumbs point inward.
// Raise order: index, middle, ring, little, thumb last (1 = index … 5 = thumb).
const SKIN = '#f8d2ae', SHADE = '#e7b088', NAIL = '#fde7d6';
const FING = { // left hand: little finger on the left, index next to the thumb
  little: { x: 13, w: 13, top: 34 },
  ring:   { x: 28, w: 14, top: 18 },
  middle: { x: 44, w: 14, top: 10 },
  index:  { x: 60, w: 14, top: 18 }
};
const ORDER = ['index', 'middle', 'ring', 'little', 'thumb'];
function handSVG(raised, right) {
  const up = new Set(ORDER.slice(0, raised));
  let g = '';
  for (const [name, f] of Object.entries(FING)) {
    if (up.has(name)) {
      g += `<rect x="${f.x}" y="${f.top}" width="${f.w}" height="${80 - f.top}" rx="${f.w / 2}" fill="${SKIN}"/>` +
           `<ellipse cx="${f.x + f.w / 2}" cy="${f.top + 7}" rx="${f.w * 0.3}" ry="4.5" fill="${NAIL}"/>`;
    } else { // folded: rounded knuckle peeking over the palm
      g += `<rect x="${f.x}" y="48" width="${f.w}" height="24" rx="${f.w / 2}" fill="${SHADE}"/>`;
    }
  }
  g += `<rect x="10" y="54" width="68" height="58" rx="22" fill="${SKIN}"/>`; // palm
  g += up.has('thumb')
    ? `<rect x="68" y="50" width="16" height="44" rx="8" fill="${SKIN}" transform="rotate(32 76 92)"/>` +
      `<ellipse cx="76" cy="57" rx="4.5" ry="4" fill="${NAIL}" transform="rotate(32 76 92)"/>`
    : `<rect x="34" y="76" width="42" height="15" rx="7.5" fill="${SHADE}"/>`; // thumb tucked across the palm
  const flip = right ? ' transform="translate(106 0) scale(-1 1)"' : '';
  return `<svg class="hand" viewBox="0 0 106 120" aria-label="${right ? 'right' : 'left'} hand"><g${flip}>${g}</g></svg>`;
}
function renderCount() {
  $('c-obj').classList.toggle('on', countStyle === 'obj');
  $('c-hand').classList.toggle('on', countStyle === 'hand');
  $('crows').innerHTML = SETS.num.map(it => {
    const items = countStyle === 'obj'
      ? Array.from({ length: it.n }, () => `<span class="citem">${it.pic}</span>`).join('')
      : it.n <= 5 ? handSVG(it.n, false) : handSVG(5, false) + handSVG(it.n - 5, true);
    return `<div class="crow" data-n="${it.n}"><div class="cnum"><div class="cdig" style="color:${ink(it.hue)}">${it.ch}</div><div class="cword">${it.word}</div></div>` +
           `<div class="citems${countStyle === 'obj' ? ' obj' : ''}">${items}</div></div>`;
  }).join('');
  document.querySelectorAll('.crow').forEach(r => r.addEventListener('click', () => { ensureAudio(); countRow(+r.dataset.n); }));
}
function lightRow(n) {
  const row = document.querySelector(`.crow[data-n="${n}"]`);
  if (!row) return null;
  document.querySelectorAll('.crow.active').forEach(r => r.classList.remove('active'));
  void row.offsetWidth; row.classList.add('active');
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  return row;
}
// Tap one row: just say that number.
function countRow(n) {
  stopCount(); if ('speechSynthesis' in window) speechSynthesis.cancel();
  const row = lightRow(n); if (!row) return;
  const r = row.querySelector('.cnum').getBoundingClientRect();
  confetti(r.left + r.width / 2, r.top + r.height / 2, 24, 6);
  sfx.pop();
  sayNow(LANGS[lang].nums[n - 1]);
}
// ▶ 1→10: one number per row.
function countAll() {
  stopCount(); if ('speechSynthesis' in window) speechSynthesis.cancel();
  LANGS[lang].nums.forEach((w, i) => countTimers.push(setTimeout(() => {
    lightRow(i + 1); sayNow(w); sfx.pop();
  }, i * 1000)));
  countTimers.push(setTimeout(() => { sfx.fanfare(); confetti(W / 2, H / 2, 80, 12); }, 10 * 1000));
}

function setMode(m) { mode = m; store.set('mode', m); streak = 0; sfx.pop(); render(); }
function setSet(s) { setName = s; store.set('set', s); loadIdx(); target = null; streak = 0; sfx.pop(); render(); }
function setLang(l) {
  if (l === lang) { sfx.pop(); render(); announceLang(); return; } // tap current flag → repeat
  const oldLearn = items()[idx], oldTarget = target, oldOpts = curOpts;
  const scroll = $('count').scrollTop;
  lang = l; store.set('lang', l); SETS = buildSets(l); pickVoice();
  if (!SETS[setName]) { setName = 'abc'; store.set('set', 'abc'); } // groups exist only in RO
  const list = items();
  // Learn: stay on the same letter/number
  const li = list.indexOf(mapItem(oldLearn, list));
  if (li >= 0) { idx = li; store.set(idxKey(), idx); } else loadIdx();
  // Play: keep the same question + bubbles, just re-ask in the new language
  keepRound = false;
  if (mode === 'play' && oldTarget) {
    const t = mapItem(oldTarget, list), o = oldOpts.map(x => mapItem(x, list));
    if (t && o.every(Boolean) && new Set(o).size === o.length) {
      target = t; curOpts = o;
      if (round.lower && t.key === t.ch) round.lower = false;
      keepRound = true;
    }
  }
  if (!keepRound) target = null;
  sfx.pop(); render(); keepRound = false;
  if (mode === 'count') $('count').scrollTop = scroll;
  announceLang();
}
// Say the language name in that language, then the current item ("Română. a, de la albină!")
function announceLang() {
  const name = LANGS[lang].langName;
  if (mode === 'learn') speak(`${name}. ${items()[idx].say}`, 120);
  else if (mode === 'play' && target) speak(`${name}. ${askLine()}`, 250);
  else if (mode === 'read') speak(`${name}. ${readData().word}`, 120);
  else speak(`${name}!`, 120);
}
document.querySelectorAll('.flag').forEach(f =>
  f.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); firstTouch(); setLang(f.dataset.lang); }));

// First interaction unlocks audio + speech (browser autoplay rules)
let started = false;
function firstTouch() {
  if (started) return;
  started = true;
  ensureAudio();
}
addEventListener('pointerdown', firstTouch, true);
addEventListener('keydown', firstTouch, true);

function tapBtn(id, fn) {
  $(id).addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); firstTouch(); fn(); });
}
tapBtn('m-learn', () => setMode('learn'));
tapBtn('m-play', () => setMode('play'));
tapBtn('m-count', () => setMode('count'));
tapBtn('m-read', () => setMode('read'));
tapBtn('rprev', () => readStep(-1));
tapBtn('rnext', () => readStep(1));
tapBtn('rplay', () => playRead());
tapBtn('c-obj', () => { countStyle = 'obj'; store.set('cstyle', 'obj'); stopCount(); sfx.pop(); renderCount(); });
tapBtn('c-hand', () => { countStyle = 'hand'; store.set('cstyle', 'hand'); stopCount(); sfx.pop(); renderCount(); });
tapBtn('c-all', () => countAll());
tapBtn('s-abc', () => setSet('abc'));
tapBtn('s-123', () => setSet('num'));
tapBtn('s-grp', () => setSet('grp'));
tapBtn('prev', () => step(-1));
tapBtn('next', () => step(1));
$('glyph').addEventListener('pointerdown', e => { e.stopPropagation(); showLearn(); sfx.pop(); confetti(e.clientX, e.clientY, 18, 6); });
$('ask').addEventListener('pointerdown', e => { e.stopPropagation(); speak(askLine()); });

// Swipe left/right in learn mode
let sx = null;
$('stage').addEventListener('pointerdown', e => { sx = e.clientX; });
$('stage').addEventListener('pointerup', e => {
  if (sx == null || (mode !== 'learn' && mode !== 'read')) return;
  const dx = e.clientX - sx; sx = null;
  if (Math.abs(dx) > 50) (mode === 'read' ? readStep : step)(dx < 0 ? 1 : -1);
});

// Keyboard: type a letter/digit → it shows up (learn) or counts as an answer (play)
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (mode === 'read') {
    if (k === 'arrowright') readStep(1); else if (k === 'arrowleft') readStep(-1);
    else if (k === ' ' || k === 'enter') { e.preventDefault(); ensureAudio(); playRead(); }
    return;
  }
  if (k === 'arrowright') { if (mode === 'learn') step(1); return; }
  if (k === 'arrowleft')  { if (mode === 'learn') step(-1); return; }
  if (e.repeat) return;
  const isLetter = /^\p{L}$/u.test(k), isDigit = /^[0-9]$/.test(k);
  if (mode === 'count') {
    if (isDigit) { ensureAudio(); countRow(k === '0' ? 10 : +k); }
    else if (k === ' ' || k === 'enter') { e.preventDefault(); ensureAudio(); countAll(); }
    return;
  }
  if (!isLetter && !isDigit) {
    if (k === ' ' || k === 'enter') { e.preventDefault(); if (mode === 'learn') step(1); else speak(askLine()); }
    return;
  }
  const want = isLetter ? 'abc' : 'num';
  if (!SETS[want].some(it => it.key === k)) return; // letter not in this language's alphabet
  if (want !== setName) { setSet(want); if (mode === 'play') return; }
  const list = items();
  const i = list.findIndex(it => it.key === k);
  if (i < 0) return;
  if (mode === 'learn') { idx = i; sfx.pop(); showLearn(); confetti(W / 2, H / 2, 24, 7); }
  else {
    const btn = [...document.querySelectorAll('.bub')].find(b => b.dataset.ch === list[i].ch);
    choose(list[i], btn || null);
  }
});
addEventListener('contextmenu', e => e.preventDefault());

render();

// ====== PWA ======
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
}
(function () {
  const bar = $('install-bar'), btn = $('install-btn'), msg = $('install-msg'), dismiss = $('dismiss-btn');
  let deferred = null;
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) return;
  try { if (sessionStorage.getItem('install-dismissed')) return; } catch (e) {}
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    msg.textContent = 'Install ABC 123! on your device';
    bar.style.display = 'flex';
  });
  if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
    setTimeout(() => {
      if (deferred) return;
      msg.innerHTML = 'Tap <strong>Share</strong> then <strong>Add to Home Screen</strong>';
      btn.style.display = 'none'; bar.style.display = 'flex';
    }, 1500);
  }
  bar.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('click', () => {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(() => { deferred = null; bar.style.display = 'none'; });
  });
  dismiss.addEventListener('click', () => {
    bar.style.display = 'none';
    try { sessionStorage.setItem('install-dismissed', '1'); } catch (e) {}
  });
  addEventListener('appinstalled', () => { bar.style.display = 'none'; });
})();
</script>
</body>
</html>
