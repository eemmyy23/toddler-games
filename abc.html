<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ABC 123! 🔤</title>
<link rel="icon" href="abc-icon-192.png" type="image/png">
<link rel="manifest" href="manifest-abc.json">
<meta name="theme-color" content="#090c1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ABC 123!">
<link rel="apple-touch-icon" href="abc-icon-192.png">
<style>
/* Fredoka (OFL), self-hosted so it works offline */
@font-face{font-family:'Fredoka';font-weight:400 700;font-display:swap;src:url(fonts/fredoka-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Fredoka';font-weight:400 700;font-display:swap;src:url(fonts/fredoka-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
/* Night theme: deep navy, warm muted accents, no white surfaces (bedtime / tent friendly) */
:root{
  --bg0:#090c1f; --bg1:#11163a; --card:#1a2050; --card2:#232a63; --line:rgba(255,255,255,.07);
  --text:#efe6d6; --muted:#9e98bf; --amber:#f0b24a; --amber-ink:#2b1d02; --amber-soft:rgba(240,178,74,.16);
  --font:'Fredoka',ui-rounded,'Nunito','Segoe UI',system-ui,sans-serif;
  --r:22px; --top:122px; --bot:calc(70px + min(env(safe-area-inset-bottom), 8px));
  --shadow:0 6px 18px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{color:var(--text);font-family:var(--font);background:var(--bg0);
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,240,200,.55),transparent 60%),
    radial-gradient(1.5px 1.5px at 78% 9%,rgba(255,240,200,.45),transparent 60%),
    radial-gradient(1px 1px at 46% 31%,rgba(255,240,200,.4),transparent 60%),
    radial-gradient(1px 1px at 88% 44%,rgba(255,240,200,.35),transparent 60%),
    radial-gradient(1.5px 1.5px at 22% 66%,rgba(255,240,200,.3),transparent 60%),
    radial-gradient(ellipse at 50% 0%,#1b2156 0%,transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg0))}
body{--top:70px} /* one top row everywhere: flags · back · (index) · (stars) */
button{font-family:var(--font)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}

/* Top bar: flags + stars, then the set switcher */
#bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px;padding:max(10px,env(safe-area-inset-top)) 12px 6px}
.group{display:flex;gap:6px;background:var(--card);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
#flags{gap:6px}
.flag{border:none;background:transparent;border-radius:999px;width:52px;height:44px;font-size:26px;line-height:1;cursor:pointer;touch-action:manipulation;opacity:.5;filter:saturate(.7);transition:opacity .15s,background .15s}
.flag.on{opacity:1;filter:none;background:var(--amber-soft);box-shadow:inset 0 0 0 2px var(--amber)}
#gridbtn{width:54px;height:54px;border:none;border-radius:50%;background:var(--card);color:var(--amber);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow)}
#gridbtn,#barback{display:none}
body:not([data-mode=play]) #stars{display:none}
body.topic #barback{display:flex;margin-left:auto}
body.idx #gridbtn{display:flex}
#barback{height:54px;padding:0 14px;border:none;border-radius:999px;background:var(--card);color:var(--amber);font-size:22px;font-weight:600;align-items:center;gap:4px;cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow)}
#stars{background:var(--card);border-radius:999px;height:54px;padding:0 16px;display:flex;align-items:center;gap:6px;font-size:22px;font-weight:600;box-shadow:var(--shadow)}
#hub{display:none;width:100%;max-width:640px;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;grid-template-columns:1fr 1fr;grid-auto-rows:auto;align-content:start;gap:12px;padding:4px 2px 8px}
/* one tile component for every hub: top row reserved for the age badge, grows with its content, never stretched */
.ht{position:relative;border:none;border-radius:26px;background:var(--card);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow);font-size:19px;font-weight:600;padding:34px 8px 10px;text-align:center;line-height:1.15;min-height:clamp(132px,22vh,160px);height:max-content}
.ht .hp{font-size:48px;line-height:1}
/* age badge: which age a tile is for — position = age (left little · centre explorer · right scientist), from config order */
.agebadge{position:absolute;top:7px;left:calc(10px + (100% - 20px - 28px) * var(--ax));width:28px;height:28px;opacity:.9;pointer-events:none}
.agebadge svg{width:100%;height:100%;display:block}
.ht .hp{order:1}.ht .hl{order:2} /* 'soon' (order 3) flows under the label */
.hh{grid-column:1/-1;font-size:15px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:6px 6px 0;align-self:end}
#ask .objs{display:grid;grid-template-columns:repeat(5,auto);gap:4px 10px;font-size:min(6vh,9vw);line-height:1.1;cursor:default}
#choices.wrd .bub{font-size:calc(var(--s)*.5)}
.ht:active{background:var(--card2)}
.ht.soon{opacity:.45;cursor:default}
.ht .badge{order:3;white-space:nowrap;font-size:12px;font-weight:600;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:2px 8px}

/* Bottom tab bar, like a regular app */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;height:var(--bot);padding:4px 8px min(env(safe-area-inset-bottom), 8px);display:flex;justify-content:space-around;align-items:flex-start;background:rgba(13,17,44,.94);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.tab{flex:1;max-width:120px;height:62px;border:none;border-radius:20px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;touch-action:manipulation}
.tab .ti{font-size:28px;line-height:1;filter:saturate(.75)}
.tab .tl{font-size:13px;font-weight:600}
.tab.on{background:var(--amber-soft);color:var(--amber)}
.tab.on .ti{filter:none;transform:scale(1.08)}

#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--top) 12px calc(var(--bot) + 12px)}
body[data-mode=card] #stage{padding-bottom:calc(var(--bot) + 100px)}
body[data-mode=read] #stage{padding-bottom:calc(var(--bot) + 96px)}

/* Learn */
#learn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:1.6vh}
#glyph{font-size:min(28vh,46vw);line-height:1.1;font-weight:700;cursor:pointer;text-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .15s}
#glyph.grp{font-size:min(22vh,26vw)}
.sw{display:inline-block;width:min(30vh,52vw);height:min(30vh,52vw);border-radius:50%;box-shadow:inset 0 -10px 0 rgba(0,0,0,.15),0 10px 30px rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.22);vertical-align:middle}
.rbsvg{display:block;width:min(44vh,80vw);height:auto;overflow:visible}
.rbb{fill:none;stroke-width:10.6}
.part{cursor:pointer;transition:opacity .2s,filter .2s}
#glyph.on .part{opacity:.28}
#glyph.on .part.lit{opacity:1;filter:drop-shadow(0 0 5px rgba(255,255,255,.8))}
.nav .dot{display:inline-block;width:40px;height:40px;border-radius:50%;vertical-align:middle;border:2px solid rgba(255,255,255,.25)}
#glyph small{font-size:.5em;opacity:.85;margin-left:.06em}
#glyph.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
#word{font-size:min(6vh,8vw);font-weight:600;text-align:center;min-height:1.2em}
#pics{font-size:min(7vh,9vw);text-align:center;max-width:94vw;line-height:1.2;min-height:1.2em;letter-spacing:.05em}
#pics span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6%)}}
#examples{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:640px}
.ex{border:none;background:var(--card);border-radius:var(--r);min-width:96px;padding:10px 12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text);cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow);transition:transform .15s,background .15s}
.ex .ep{font-size:40px;line-height:1.1}
.ex .ew{font-size:19px;font-weight:500;white-space:nowrap}
.ex .ew b{font-weight:700}
.ex.lit{background:var(--card2);transform:translateY(-4px) scale(1.04)}
.nav{position:fixed;bottom:calc(var(--bot) + 12px);z-index:4;min-width:112px;height:72px;padding:0 18px;border-radius:999px;border:none;background:var(--card);color:var(--muted);font-size:24px;cursor:pointer;touch-action:manipulation;white-space:nowrap;box-shadow:var(--shadow)}
.nav b{font-size:40px;font-weight:700;vertical-align:middle}
.nav:active{background:var(--card2)}
#prev{left:12px}#next{right:12px}

/* Play */
#play{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:4vh}
#ask{font-size:min(5.5vh,7.5vw);font-weight:600;display:flex;align-items:center;gap:.4em;cursor:pointer;background:var(--card);padding:.25em .4em .25em .6em;border-radius:999px;box-shadow:var(--shadow)}
#ask b{display:inline-block;background:var(--amber);color:var(--amber-ink);border-radius:.4em;padding:0 .35em;font-weight:700}
#choices{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:min(4vw,4vh);max-width:96vw}
.bub{--s:min(28vh,40vw);--c:#7fb4ff;width:var(--s);height:var(--s);border-radius:50%;border:none;font-weight:700;font-size:calc(var(--s)*.56);color:#14183a;cursor:pointer;touch-action:manipulation;
  background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 72%,#000) 100%);
  box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 -8px 0 rgba(0,0,0,.12);animation:float 4s ease-in-out infinite}
.n3 .bub{--s:min(25vh,28vw)}
.n4 .bub{--s:min(21vh,21vw)}
@media (orientation:portrait){#choices.n4{display:grid;grid-template-columns:repeat(2,auto)}#choices.n4 .bub{--s:min(21vh,36vw)}}
#choices.grp .bub{font-size:calc(var(--s)*.34)}
@keyframes float{50%{transform:translateY(-6px)}}
.bub.wrong{animation:wobble .5s}
@keyframes wobble{25%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
.bub.right{animation:burst .5s forwards}
@keyframes burst{50%{transform:scale(1.2)}100%{transform:scale(0);opacity:0}}

/* Count */
#count{display:none;position:absolute;left:0;right:0;top:var(--top);bottom:var(--bot);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:0 10px 20px}
#ctools{position:sticky;top:0;z-index:2;display:flex;justify-content:center;gap:10px;padding:6px 0 12px;background:linear-gradient(var(--bg1) 75%,transparent)}
#ctools button{border:none;border-radius:999px;height:52px;padding:0 20px;font-size:24px;font-weight:600;color:var(--text);background:var(--card);cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow)}
#ctools button.on{background:var(--amber);color:var(--amber-ink)}
/* ▶ while counting: pressed look + hatched fill that grows with the progress (--p 0…1) */
#c-all{position:relative;overflow:hidden;--p:0}
#c-all::before{content:'';position:absolute;inset:0;width:calc(var(--p) * 100%);background:repeating-linear-gradient(-45deg,rgba(255,201,77,.45) 0 7px,rgba(255,201,77,.2) 7px 14px);transition:width .5s ease-out;pointer-events:none}
#c-all.playing{box-shadow:inset 0 0 0 3px var(--amber),inset 0 3px 8px rgba(0,0,0,.45);transform:translateY(2px);color:var(--amber)}
.crow{display:flex;align-items:center;gap:12px;margin:0 auto 10px;max-width:900px;padding:8px 12px;border-radius:var(--r);background:var(--card);cursor:pointer;transition:background .2s,transform .2s}
.crow.active{background:var(--card2);box-shadow:inset 0 0 0 2px var(--amber);transform:scale(1.02)}
.cnum{flex:0 0 auto;width:96px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.cdig{font-size:54px;font-weight:700;line-height:1}
.citems{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 6px;font-size:34px;line-height:1.1;min-height:60px}
.citem{display:inline-block;text-align:center}
.citems.obj{display:grid;grid-template-columns:repeat(5,1fr);gap:6px 10px;align-items:center}
.hand{width:84px;height:96px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.crow.active .citem,.crow.active .hand{animation:wig .7s ease}
@keyframes wig{30%{transform:translateY(-8px) rotate(-5deg)}60%{transform:translateY(-3px) rotate(4deg)}}
.cword{font-size:19px;font-weight:600;color:var(--text);opacity:.9;white-space:nowrap}

/* Read: word → letters, small letters, syllables, whole word */
#read{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:1.6vh}
#rpic{font-size:min(14vh,24vw);line-height:1.1;cursor:pointer}
.rrow{display:flex;flex-wrap:nowrap;justify-content:center;gap:6px;max-width:100%}
.rt{border:none;flex:0 1 54px;min-width:34px;height:58px;border-radius:16px;background:var(--card);color:var(--text);font-size:32px;font-weight:600;cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow);transition:transform .15s,background .15s,box-shadow .15s}
.rrow.syl .rt{flex:0 1 auto;min-width:0;padding:0 min(16px,2.4vw);font-size:var(--sf,32px)}
.rrow.let .rt{flex:0 0 var(--tw,54px);width:var(--tw,54px);min-width:0;font-size:var(--tf,32px)}
.rt.word{flex:0 0 auto;padding:0 26px;font-size:36px;height:64px;color:var(--amber)}
.rt.lit{background:var(--card2);box-shadow:inset 0 0 0 2px var(--amber),var(--shadow);transform:translateY(-4px) scale(1.06)}
.rsep{align-self:center;color:var(--muted);font-size:26px}
.rc{border:none;display:flex;align-items:center;gap:8px;background:var(--card);color:var(--text);border-radius:999px;height:52px;padding:0 16px 0 10px;font-size:20px;font-weight:600;cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow);white-space:nowrap;transition:transform .15s,background .15s,box-shadow .15s}
.rc .rce{font-size:26px;letter-spacing:-2px}
.rc.lit{background:var(--card2);box-shadow:inset 0 0 0 2px var(--amber),var(--shadow);transform:translateY(-3px)}
#rC{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;width:100%;max-width:520px}
.rh{text-align:center;font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
#rC .rc{justify-content:flex-start;min-width:0;overflow:hidden;font-size:var(--cf,20px)}
#rC.tall .rc{flex-direction:column;justify-content:center;height:auto;padding:4px 8px;gap:0;border-radius:18px}
#rC.tall .rce{font-size:18px}
.rc.none{background:transparent;box-shadow:inset 0 0 0 2px var(--line);color:var(--muted);font-size:14px;justify-content:center;cursor:default;white-space:normal;text-align:center;line-height:1.1;padding:0 8px}
.infobtn{display:inline-block;border:none;margin-top:4px;height:48px;padding:0 20px;border-radius:999px;background:var(--card);color:var(--amber);font-size:19px;font-weight:600;cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow)}
#info{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;background:rgba(9,12,31,.97);padding:max(12px,env(safe-area-inset-top)) 14px 14px}
#info.open{display:flex}
#infohead{display:flex;align-items:center;gap:10px;padding-bottom:10px}
#infotitle{flex:1;font-size:24px;font-weight:700}
#infoclose{width:54px;height:54px;border:none;border-radius:50%;background:var(--card);color:var(--text);font-size:24px;cursor:pointer}
#infolist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;max-width:640px;width:100%;margin:0 auto}
.inf{border:none;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);color:var(--text);border-radius:20px;padding:12px 16px;font-size:19px;font-weight:500;line-height:1.3;cursor:pointer;touch-action:manipulation;transition:background .2s,box-shadow .2s}
.inf .ie{font-size:36px;flex:0 0 auto}
.inf.lit{background:var(--card2);box-shadow:inset 0 0 0 2px var(--amber)}
#infofoot{display:flex;justify-content:center;padding-top:12px}
#infoplay{width:72px;height:72px;border-radius:50%;border:none;background:var(--amber);color:var(--amber-ink);font-size:32px;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.45)}
@media (max-height:700px){.inf{font-size:17px;padding:9px 12px}.inf .ie{font-size:28px}#infoplay{width:60px;height:60px}}
.flag{position:relative}
.flag .nv{display:none;position:absolute;right:-2px;bottom:-4px;font-size:14px;font-style:normal}
.flag.novoice .nv{display:block}
/* age profiles: three bikes in the middle of the bar (hubs only — inside a lesson the bar holds back/index/stars) */
#ages{margin:0 auto;gap:4px}
body.topic #ages{display:none}
.age{border:none;background:transparent;border-radius:999px;width:50px;height:44px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;opacity:.45;filter:saturate(.6);transition:opacity .15s,background .15s}
.age svg{width:34px;height:34px;display:block}
.age small{font-size:10px;line-height:1;color:var(--muted);font-weight:600;margin-top:-3px}
.age.on{opacity:1;filter:none;background:var(--amber-soft);box-shadow:inset 0 0 0 2px var(--amber)}
.age.on small{color:var(--amber)}
@media (max-width:350px){.age{width:40px;height:40px}.age svg{width:30px;height:30px}}
#index{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;background:rgba(9,12,31,.97);padding:max(12px,env(safe-area-inset-top)) 12px 12px}
#index.open{display:flex}
#ixhead{display:flex;gap:10px;align-items:center;padding-bottom:10px}
#ixbody{flex:1;min-height:0;display:flex;gap:6px}
#ixgrid{position:relative}
.ixh{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;padding:10px 4px 0}
.ixh b{font-size:34px;line-height:1}.ixh span{font-size:15px;font-weight:600;color:var(--muted)}
#ixaz{flex:0 0 28px;display:none;flex-direction:column;justify-content:space-between;align-items:center;background:var(--card);border-radius:999px;padding:8px 0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.az{font-size:13px;font-weight:700;color:var(--muted);line-height:1;width:24px;text-align:center;padding:1px 0;border-radius:999px}
.az.off{opacity:.3}.az{transition:background .15s,color .15s,transform .15s}.az.cur{background:var(--amber);color:var(--amber-ink);transform:scale(1.25)}
/* search: a pill on every hub + in the index; full-screen results, matched in every language */
.sbox{flex:1;display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;border:none;border-radius:999px;background:var(--card);color:var(--muted);font-size:18px;font-weight:600;text-align:left;cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow);min-width:0}
.sbox::before{content:'🔍';flex:0 0 auto} /* the only place the search symbol is defined */
.sbox span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbox.on{box-shadow:inset 0 0 0 2px var(--amber),var(--shadow);cursor:text}
.hsearch{grid-column:1/-1;height:52px;font-size:17px}
.ico.txt{font-weight:800;letter-spacing:.02em;font-family:inherit}
.ht .ico.txt{font-size:34px;color:var(--amber)}.srk.ico.txt{font-size:15px;color:var(--amber)}
.tab .ti.txt{font-size:21px;height:28px;display:flex;align-items:center;color:inherit;filter:none}
#barback .ico.txt{font-size:18px;color:inherit}.hh .ico.txt{font-size:inherit;color:inherit}
#search{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:rgba(9,12,31,.98);padding:max(12px,env(safe-area-inset-top)) 12px 12px}
#search.open{display:flex}
#shead{display:flex;gap:10px;align-items:center}
#sq{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--text);font:inherit;font-size:20px;-webkit-appearance:none;appearance:none}
#sq::-webkit-search-cancel-button{display:none}
#sqclear{border:none;background:var(--card2);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;visibility:hidden}
#sclose{width:54px;height:54px;flex:0 0 54px;border:none;border-radius:50%;background:var(--card);color:var(--text);font-size:24px;cursor:pointer}
#smeta{padding:12px 6px 8px;font-size:15px;font-weight:600;color:var(--muted);min-height:20px}
#sres{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.sr{display:flex;align-items:center;gap:14px;min-height:76px;padding:10px 14px;border:none;border-radius:22px;background:var(--card);color:var(--text);text-align:left;cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow)}
.srp{flex:0 0 56px;height:56px;border-radius:16px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:34px}
.srp b{font-size:34px}.srp .dot,.ix .dot{display:inline-block;border-radius:50%;border:2px solid rgba(255,255,255,.25)}.srp .dot{width:34px;height:34px}.ix .dot{width:40px;height:40px}
.srt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.srt b{font-size:24px;line-height:1.1}.srt small{font-size:15px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr mark{background:none;color:var(--amber);font-weight:700}
.srk{flex:0 0 auto;font-size:22px;opacity:.8}
.shint{color:var(--muted);text-align:center;font-size:16px;line-height:1.4;padding:24px 20px}
#ixclose{width:54px;height:54px;border:none;border-radius:50%;background:var(--card);color:var(--text);font-size:24px;cursor:pointer;touch-action:manipulation}
#ixgrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;align-content:start;padding-bottom:20px}
.ix{height:84px;border:none;border-radius:18px;background:var(--card);color:var(--text);font-size:38px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;touch-action:manipulation;line-height:1.15;padding-top:2px}
.ix small{font-size:14px;font-weight:500;color:var(--muted)}
.ix.on{box-shadow:inset 0 0 0 2px var(--amber);background:var(--card2)}
#rnav{position:fixed;left:0;right:0;bottom:calc(var(--bot) + 12px);z-index:4;display:none;justify-content:space-between;align-items:center;padding:0 12px}
#rnav .nav{position:static}
#rnav .nav b{font-size:36px}
#rplay{width:76px;height:76px;border-radius:50%;border:none;background:var(--amber);color:var(--amber-ink);font-size:34px;cursor:pointer;touch-action:manipulation;box-shadow:0 8px 22px rgba(0,0,0,.45)}

#install-bar{position:fixed;top:0;left:0;right:0;z-index:10;display:none;align-items:center;justify-content:center;gap:12px;padding:10px 16px;background:var(--card);color:var(--text)}
#install-bar button{border:none;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:600;cursor:pointer}
#install-btn{background:var(--amber);color:var(--amber-ink)}
#dismiss-btn{background:transparent;color:var(--muted);font-size:20px}
#install-msg{font-size:14px}
#ver{position:fixed;bottom:calc(var(--bot) + 2px);right:8px;color:rgba(239,230,214,.25);font:11px sans-serif;pointer-events:none;z-index:4}

@media (max-width:440px){
  #bar{padding-left:8px;padding-right:8px}
  .flag{width:46px}
  .cnum{width:76px}.cdig{font-size:44px}.cword{font-size:16px}.citems{font-size:26px;min-height:48px}.hand{width:68px;height:78px}
  .rt{height:52px;font-size:28px}.rt.word{font-size:32px;height:58px;padding:0 16px}
  .ex{min-width:88px;padding:8px 10px 6px}.ex .ep{font-size:34px}.ex .ew{font-size:17px}
}
@media (max-height:700px){
  .ht{font-size:17px;gap:4px}.ht .hp{font-size:36px}#hub{gap:10px}
  #glyph{font-size:min(24vh,42vw)}
  .rt{height:42px;font-size:24px}.rt.word{height:46px;font-size:28px}#rpic{font-size:9vh}.rc{height:44px;font-size:17px}.rc .rce{font-size:20px}
  #read{gap:1vh}
  #read.tight{gap:4px}#read.tight #rpic{font-size:7vh}#read.tight .rt{height:36px;font-size:21px}#read.tight .rt.word{height:40px;font-size:25px}
  #read.tight .rc{height:36px}#read.tight .rc .rce{display:none}#read.tight #rC.tall .rc{padding:2px 8px}
  .ex{flex-direction:row;gap:6px;padding:6px 12px 6px 8px;min-width:0}.ex .ep{font-size:26px}.ex .ew{font-size:16px}
  #examples{gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:350px){.flag{width:40px;height:40px;font-size:22px}#gridbtn{width:46px;height:46px}#stars{height:46px;padding:0 10px;font-size:19px}#bar{gap:6px}#barback{height:46px;padding:0 10px;font-size:19px}}
</style>
</head>
<body>
<div id="bar">
  <div id="flags" class="group"></div>
  <div id="ages" class="group" role="radiogroup"></div>
  <button id="barback" aria-label="Back"></button>
  <button id="gridbtn" aria-label="Index"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2.5"/><rect x="13" y="3" width="8" height="8" rx="2.5"/><rect x="3" y="13" width="8" height="8" rx="2.5"/><rect x="13" y="13" width="8" height="8" rx="2.5"/></svg></button>
  <div id="stars">⭐ 0</div>
</div>

<div id="stage">
  <div id="hub"></div>
  <div id="learn">
    <div id="glyph"></div>
    <div id="pics"></div>
    <div id="word"></div>
    <div id="linfo"></div>
    <div id="examples"></div>
  </div>
  <div id="play">
    <div id="ask"></div>
    <div id="choices"></div>
  </div>
  <div id="read"></div>
</div>
<div id="count">
  <div id="ctools">
    <button id="c-obj" class="on" aria-label="Objects">🍓</button>
    <button id="c-hand" aria-label="Fingers">✋</button>
    <button id="c-all" aria-label="Count all">▶ 1→10</button>
  </div>
  <div id="crows"></div>
</div>
<button class="nav" id="prev" aria-label="Previous">◀</button>
<button class="nav" id="next" aria-label="Next">▶</button>
<div id="rnav">
  <button class="nav" id="rprev" aria-label="Previous word"></button>
  <button id="rplay" aria-label="Play">▶</button>
  <button class="nav" id="rnext" aria-label="Next word"></button>
</div>
<div id="info"><div id="infohead"><span id="infotitle"></span><button id="infoclose" aria-label="Close">✕</button></div>
  <div id="infolist"></div><div id="infofoot"><button id="infoplay" aria-label="Play">▶</button></div></div>
<div id="index"><div id="ixhead"><button id="ixsearch" class="sbox"><span></span></button><button id="ixclose" aria-label="Close">✕</button></div><div id="ixbody"><div id="ixgrid"></div><div id="ixaz"></div></div></div>
<div id="search"><div id="shead"><div class="sbox on"><input id="sq" type="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"><button id="sqclear" aria-label="Clear">✕</button></div><button id="sclose" aria-label="Close">✕</button></div><div id="smeta"></div><div id="sres"></div></div>
<nav id="tabs"></nav>
<canvas id="fx"></canvas>

<div id="install-bar">
  <span id="install-msg"></span>
  <button id="install-btn">Install App</button>
  <button id="dismiss-btn">&times;</button>
</div>
<div id="ver">v1.1.0</div>

<!-- All scripts are listed (in load order) by abc/manifest.js, generated by `node tools/check.js --fix`.
     Adding a language or a module never edits this file. See ARCHITECTURE.md. -->
<script src="abc/manifest.js"></script>
<script>
(function () {
  var M = self.MANIFEST;
  M.scripts.forEach(function (src) {
    var e = document.createElement('script');
    e.src = src + '?v=' + M.version; e.async = false; // async=false keeps execution order, downloads in parallel
    document.body.appendChild(e);
  });
})();
</script>
</body>
</html>
