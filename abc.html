<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ABC 123! 🔤</title>
<link rel="icon" href="abc-icon-192.png" type="image/png">
<link rel="manifest" href="manifest-abc.json">
<meta name="theme-color" content="#1b1446">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ABC 123!">
<link rel="apple-touch-icon" href="abc-icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 30%,#3a2a8a 0%,#1b1446 70%);font-family:"Comic Sans MS","Chalkboard SE","Baloo 2",system-ui,sans-serif;color:#fff}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}

/* Top bar */
#bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px 6px;gap:8px}
#flags{order:-1;flex-basis:100%;justify-content:center;background:none;padding:0;gap:14px}
.flag{border:none;background:rgba(255,255,255,0.12);border-radius:14px;width:58px;height:42px;font-size:28px;line-height:1;cursor:pointer;touch-action:manipulation;opacity:.55;transition:opacity .15s,transform .15s}
.flag.on{opacity:1;background:rgba(255,204,51,0.9);transform:scale(1.12);box-shadow:0 3px 10px rgba(0,0,0,0.3)}
@media (min-width:760px){#flags{order:0;flex-basis:auto}}
.group{display:flex;gap:6px;background:rgba(255,255,255,0.12);border-radius:40px;padding:5px}
.tbtn{border:none;border-radius:32px;min-width:58px;height:50px;padding:0 14px;font:inherit;font-size:22px;font-weight:700;color:#fff;background:transparent;cursor:pointer;touch-action:manipulation}
.tbtn.on{background:#ffcc33;color:#3a2a8a;box-shadow:0 3px 10px rgba(0,0,0,0.3)}
#stars{font-size:22px;font-weight:700;padding:0 10px;min-width:70px;text-align:center}

#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:130px 12px 110px}
@media (min-width:760px){#stage{padding-top:80px}}

/* Learn mode */
#learn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:2vh}
#glyph{font-size:min(42vh,62vw);line-height:1;font-weight:900;cursor:pointer;text-shadow:0 8px 0 rgba(0,0,0,0.25);transition:transform .15s}
#glyph small{font-size:0.45em;opacity:0.85;margin-left:0.08em}
#glyph.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.5) rotate(-8deg)}60%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
#word{font-size:min(7vh,9vw);font-weight:700;text-align:center;min-height:1.2em}
#pics{font-size:min(8vh,10vw);text-align:center;max-width:94vw;line-height:1.2;min-height:1.2em;letter-spacing:.05em}
#pics span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8%)}}
.nav{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));z-index:4;min-width:120px;height:80px;padding:0 18px;border-radius:40px;border:none;background:rgba(255,255,255,0.18);color:#fff;font:inherit;font-size:28px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.nav b{font-size:46px;font-weight:900;vertical-align:middle;text-shadow:0 3px 0 rgba(0,0,0,0.25)}
.nav:active{background:rgba(255,255,255,0.35)}
#prev{left:10px}#next{right:10px}

/* Play mode */
#play{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:4vh}
#ask{font-size:min(6vh,8vw);font-weight:700;display:flex;align-items:center;gap:.4em;cursor:pointer}
#ask b{display:inline-block;background:#ffcc33;color:#3a2a8a;border-radius:.3em;padding:0 .3em}
#choices{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:min(4vw,4vh);max-width:96vw}
.bub{--s:min(30vh,40vw);width:var(--s);height:var(--s);border-radius:50%;border:none;font:inherit;font-weight:900;font-size:calc(var(--s)*0.6);color:#fff;cursor:pointer;touch-action:manipulation;box-shadow:inset -8px -10px 0 rgba(0,0,0,0.18),inset 8px 8px 0 rgba(255,255,255,0.25),0 8px 20px rgba(0,0,0,0.35);animation:float 3s ease-in-out infinite;text-shadow:0 4px 0 rgba(0,0,0,0.2)}
.n3 .bub{--s:min(26vh,28vw)}
.n4 .bub{--s:min(22vh,21vw)}
@media (orientation:portrait){#choices.n4{display:grid;grid-template-columns:repeat(2,auto)}#choices.n4 .bub{--s:min(22vh,36vw)}}
@keyframes float{50%{transform:translateY(-10px)}}
.bub.wrong{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
.bub.right{animation:burst .5s forwards}
@keyframes burst{50%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}

#install-bar{position:fixed;bottom:0;left:0;right:0;z-index:10;display:none;align-items:center;justify-content:center;gap:12px;padding:10px 16px;background:rgba(20,20,60,0.92);font-family:system-ui,sans-serif}
#install-bar button{border:none;border-radius:8px;padding:8px 18px;font-size:15px;font-weight:600;cursor:pointer}
#install-btn{background:#ff5533;color:#fff}
#dismiss-btn{background:transparent;color:rgba(255,255,255,0.5);font-size:20px}
#install-msg{color:#eee;font-size:14px}
#ver{position:fixed;bottom:6px;left:8px;color:rgba(255,255,255,0.25);font:11px sans-serif;pointer-events:none;z-index:4}
/* Count mode */
#count{display:none;position:absolute;inset:0;top:130px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:0 10px 90px}
@media (min-width:760px){#count{top:80px}}
#ctools{position:sticky;top:0;z-index:2;display:flex;justify-content:center;gap:10px;padding:6px 0 10px;background:linear-gradient(#251a5e 70%,transparent)}
#ctools button{border:none;border-radius:30px;height:50px;padding:0 18px;font:inherit;font-size:24px;font-weight:700;color:#fff;background:rgba(255,255,255,0.15);cursor:pointer;touch-action:manipulation}
#ctools button.on{background:#ffcc33;color:#3a2a8a}
.crow{display:flex;align-items:center;gap:12px;margin:0 auto 10px;max-width:900px;padding:8px 12px;border-radius:24px;background:rgba(255,255,255,0.07);cursor:pointer;transition:background .2s,transform .2s}
.crow.active{background:rgba(255,204,51,0.22);transform:scale(1.02)}
.cnum{flex:0 0 auto;width:1.6em;text-align:center;font-size:56px;font-weight:900;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,0.25)}
.citems{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 6px;font-size:34px;line-height:1.1;min-height:60px}
.citem{display:inline-block;transition:transform .2s,filter .2s;filter:grayscale(.35) brightness(.8)}
.citem.lit{filter:none;transform:scale(1.35) translateY(-6px)}
.citem.done{filter:none}
.hand{width:84px;height:100px}
.hand .f{fill:#f1c9a5;stroke:#b07c5a;stroke-width:2;transition:fill .2s}
.hand .f.lit{fill:#ffcc33}
.hand .f.done{fill:#ffe08a}
.cword{margin-left:auto;font-size:22px;font-weight:700;opacity:.8;padding-left:8px}
@media (max-width:440px){.cnum{font-size:44px}.citems{font-size:26px;min-height:48px}.hand{width:68px;height:81px}.cword{display:none}}
@media (max-width:759px){#stars{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;height:42px;line-height:42px;min-width:0;padding:0 4px;font-size:20px}}
@media (max-width:440px){#bar{padding-left:8px;padding-right:8px;gap:4px}.tbtn{min-width:44px;padding:0 8px;font-size:20px}.flag{width:50px}#flags{gap:10px}}
</style>
</head>
<body>
<div id="bar">
  <div class="group">
    <button class="tbtn on" id="m-learn" aria-label="Learn">📖</button>
    <button class="tbtn" id="m-play" aria-label="Play">🎈</button>
    <button class="tbtn" id="m-count" aria-label="Count">🧮</button>
  </div>
  <div id="stars">⭐ 0</div>
  <div class="group" id="setgrp">
    <button class="tbtn on" id="s-abc">ABC</button>
    <button class="tbtn" id="s-123">123</button>
  </div>
  <div id="flags" class="group">
    <button class="flag" data-lang="en" aria-label="English">🇬🇧</button>
    <button class="flag" data-lang="ro" aria-label="Română">🇷🇴</button>
    <button class="flag" data-lang="de" aria-label="Deutsch">🇩🇪</button>
  </div>
</div>

<div id="stage">
  <div id="learn">
    <div id="glyph"></div>
    <div id="pics"></div>
    <div id="word"></div>
  </div>
  <div id="play">
    <div id="ask"></div>
    <div id="choices"></div>
  </div>
</div>
<div id="count">
  <div id="ctools">
    <button id="c-obj" class="on" aria-label="Objects">🍓</button>
    <button id="c-hand" aria-label="Fingers">✋</button>
    <button id="c-all" aria-label="Count all">▶ 1→10</button>
  </div>
  <div id="crows"></div>
</div>
<button class="nav" id="prev" aria-label="Previous">◀</button>
<button class="nav" id="next" aria-label="Next">▶</button>
<canvas id="fx"></canvas>

<div id="install-bar">
  <span id="install-msg"></span>
  <button id="install-btn">Install App</button>
  <button id="dismiss-btn">&times;</button>
</div>
<div id="ver">v0.4.0</div>

<script>
// ====== DATA ======
// Letter rows: [letter, word, emoji, like?]  like=true → letter is inside the word, not first ("X like in fox")
const LANGS = {
  en: {
    tts: 'en-US', html: 'en',
    letters: [
      ['A','Apple','🍎'],['B','Ball','⚽'],['C','Cat','🐱'],['D','Dog','🐶'],['E','Elephant','🐘'],
      ['F','Fish','🐟'],['G','Grapes','🍇'],['H','House','🏠'],['I','Ice cream','🍦'],['J','Juice','🧃'],
      ['K','Kite','🪁'],['L','Lion','🦁'],['M','Moon','🌙'],['N','Nose','👃'],['O','Octopus','🐙'],
      ['P','Penguin','🐧'],['Q','Queen','👸'],['R','Rainbow','🌈'],['S','Sun','☀️'],['T','Tree','🌳'],
      ['U','Umbrella','☂️'],['V','Violin','🎻'],['W','Whale','🐳'],['X','fox','🦊',1],['Y','Yo-yo','🪀'],
      ['Z','Zebra','🦓']
    ],
    nums: ['one','two','three','four','five','six','seven','eight','nine','ten'],
    sayLetter: (c, w, like) => like ? `${c}. ${c}, like in ${w}!` : `${c}. ${c} is for ${w}!`,
    showWord: (w, like) => like ? `like in ${w}` : w,
    find: 'Find',
    ask: (isAbc, name, small) => isAbc ? `Find the ${small ? 'small ' : ''}letter ${name}!` : `Find the number ${name}!`,
    thats: n => `That's ${n}.`,
    cheers: ['Yay!', 'Great job!', 'You did it!', 'Super!', 'Hooray!'],
    wow: n => `Wow! ${n} stars!`
  },
  ro: {
    tts: 'ro-RO', html: 'ro',
    letters: [
      ['A','Albină','🐝'],['Ă','mașină','🚗',1],['Â','câine','🐕',1],['B','Banană','🍌'],['C','Cal','🐴'],
      ['D','Delfin','🐬'],['E','Elefant','🐘'],['F','Fluture','🦋'],['G','Girafă','🦒'],['H','Hipopotam','🦛'],
      ['I','Iepure','🐰'],['Î','Înghețată','🍦'],['J','Jucărie','🧸'],['K','Koala','🐨'],['L','Leu','🦁'],
      ['M','Măr','🍎'],['N','Nor','☁️'],['O','Ou','🥚'],['P','Pește','🐟'],['Q','Quiz','❓'],
      ['R','Rață','🦆'],['S','Soare','☀️'],['Ș','Șoarece','🐭'],['T','Tren','🚂'],['Ț','Țestoasă','🐢'],
      ['U','Urs','🐻'],['V','Vapor','🚢'],['W','Wi-Fi','📶'],['X','Xilofon','🎶'],['Y','Yoga','🧘'],
      ['Z','Zebră','🦓']
    ],
    nums: ['unu','doi','trei','patru','cinci','șase','șapte','opt','nouă','zece'],
    sayLetter: (c, w, like) => like ? `${c}. ${c}, ca în ${w}!` : `${c}. ${c}, de la ${w}!`,
    showWord: (w, like) => like ? `ca în ${w}` : w,
    find: 'Găsește',
    ask: (isAbc, name, small) => isAbc ? `Găsește litera ${small ? 'mică ' : ''}${name}!` : `Găsește numărul ${name}!`,
    thats: n => `Aceasta e ${n}.`,
    cheers: ['Bravo!', 'Super!', 'Foarte bine!', 'Ura!', 'Ai reușit!'],
    wow: n => `Uau! ${n} stele!`
  },
  de: {
    tts: 'de-DE', html: 'de',
    letters: [
      ['A','Apfel','🍎'],['Ä','Ähre','🌾'],['B','Ball','⚽'],['C','Clown','🤡'],['D','Delfin','🐬'],
      ['E','Elefant','🐘'],['F','Fisch','🐟'],['G','Giraffe','🦒'],['H','Haus','🏠'],['I','Igel','🦔'],
      ['J','Jojo','🪀'],['K','Katze','🐱'],['L','Löwe','🦁'],['M','Mond','🌙'],['N','Nase','👃'],
      ['O','Oktopus','🐙'],['Ö','Brötchen','🍞',1],['P','Pinguin','🐧'],['Q','Qualle','🪼'],['R','Regenbogen','🌈'],
      ['S','Sonne','☀️'],['ß','Fuß','🦶',1],['T','Tiger','🐯'],['U','Uhr','⏰'],['Ü','Überraschung','🎁'],
      ['V','Vogel','🐦'],['W','Wal','🐳'],['X','Xylofon','🎶'],['Y','Yacht','⛵'],['Z','Zebra','🦓']
    ],
    nums: ['eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn'],
    sayLetter: (c, w) => `${c}. ${c} wie ${w}!`,
    showWord: (w, like) => like ? `wie ${w}` : w,
    find: 'Finde',
    ask: (isAbc, name, small) => isAbc ? `Finde den ${small ? 'kleinen ' : ''}Buchstaben ${name}!` : `Finde die Zahl ${name}!`,
    thats: n => `Das ist ${n}.`,
    cheers: ['Super!', 'Toll gemacht!', 'Bravo!', 'Juhu!', 'Geschafft!'],
    wow: n => `Wow! ${n} Sterne!`
  }
};
const NUMPICS = ['🌞','🐥','🐟','🍓','⭐','🎈','🐞','🍪','🚗','🦋'];
function buildSets(code) {
  const L = LANGS[code];
  const letters = L.letters.map(([ch, w, pic, like], i, a) => ({
    ch, key: ch.toLocaleLowerCase(L.tts), pic, hue: (i * 360 / a.length) | 0,
    word: L.showWord(w, like), say: L.sayLetter(ch, w, like), name: ch
  }));
  const numbers = L.nums.map((w, i) => ({
    ch: String(i + 1), key: i === 9 ? '0' : String(i + 1), word: w, pic: NUMPICS[i], n: i + 1,
    hue: ((i + 1) * 36) % 360, name: w,
    say: `${w}!`
  }));
  return { abc: letters, num: numbers };
}

// ====== STATE (persisted best-effort) ======
const store = {
  get(k, d) { try { const v = localStorage.getItem('abc.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('abc.' + k, JSON.stringify(v)); } catch (e) {} }
};
function defaultLang() {
  const l = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return LANGS[l] ? l : 'en';
}
let lang = store.get('lang', defaultLang()); if (!LANGS[lang]) lang = 'en';
let SETS = buildSets(lang);
let mode = store.get('mode', 'learn');   // 'learn' | 'play'
let setName = store.get('set', 'abc');   // 'abc' | 'num'
let stars = store.get('stars', 0);
const idxKey = () => `idx_${lang}_${setName}`;
let idx = 0;
function loadIdx() { idx = Math.min(store.get(idxKey(), 0), SETS[setName].length - 1); }
loadIdx();
let streak = 0;
// per-item miss weight → practice what's hard more often
let weights = store.get('w', {});

const $ = id => document.getElementById(id);
const items = () => SETS[setName];

// ====== AUDIO ======
let AC = null;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (AC.state !== 'running') AC.resume();
}
function tone(freq, start, dur, vol = 0.18, type = 'sine') {
  if (!AC) return;
  const t = AC.currentTime + start;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  pop()   { tone(660, 0, 0.15, 0.15); tone(990, 0.04, 0.2, 0.08); },
  right() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.08, 0.35, 0.16, 'triangle')); },
  wrong() { tone(220, 0, 0.18, 0.12, 'triangle'); tone(196, 0.12, 0.25, 0.1, 'triangle'); },
  fanfare() { [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, i * 0.11, 0.4, 0.15, 'triangle')); }
};

// ====== SPEECH (device voice; works offline on most devices) ======
let voice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const want = LANGS[lang].tts;
  const all = speechSynthesis.getVoices();
  const vs = all.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(lang));
  voice = vs.find(v => v.lang.replace('_', '-') === want && /female|samantha|karen|ioana|anna|google/i.test(v.name))
       || vs.find(v => v.lang.replace('_', '-') === want) || vs[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, delay = 0) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : LANGS[lang].tts;
    u.rate = 0.85; u.pitch = 1.25;
    speechSynthesis.speak(u);
  }, delay);
}

// ====== FX (confetti) ======
const fx = $('fx'), fctx = fx.getContext('2d');
let W, H;
function resize() { W = fx.width = innerWidth; H = fx.height = innerHeight; }
resize(); addEventListener('resize', resize);
const parts = [];
function confetti(x, y, n = 40, spread = 9) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * spread;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4, life: 1,
      s: 6 + Math.random() * 10, hue: Math.random() * 360, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      star: Math.random() < 0.35 });
  }
}
function drawStar(c, r) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  c.closePath(); c.fill();
}
function loop() {
  fctx.clearRect(0, 0, W, H);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.vx *= 0.98; p.r += p.vr; p.life -= 0.012;
    if (p.life <= 0 || p.y > H + 40) { parts.splice(i, 1); continue; }
    fctx.save(); fctx.globalAlpha = Math.min(1, p.life * 1.5);
    fctx.translate(p.x, p.y); fctx.rotate(p.r);
    fctx.fillStyle = `hsl(${p.hue},95%,62%)`;
    if (p.star) drawStar(fctx, p.s); else fctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    fctx.restore();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ====== LEARN MODE ======
function showLearn(sayIt = true) {
  const it = items()[idx];
  const g = $('glyph');
  g.innerHTML = setName === 'abc' && it.key !== it.ch ? `${it.ch}<small>${it.key}</small>` : it.ch;
  g.style.color = `hsl(${it.hue},90%,65%)`;
  g.classList.remove('pop'); void g.offsetWidth; g.classList.add('pop');
  $('word').textContent = it.word;
  // Arrows show the neighbour they lead to
  const list = items(), L = list.length;
  const pv = list[(idx - 1 + L) % L], nx = list[(idx + 1) % L];
  $('prev').innerHTML = `◀ <b style="color:hsl(${pv.hue},90%,70%)">${pv.ch}</b>`;
  $('next').innerHTML = `<b style="color:hsl(${nx.hue},90%,70%)">${nx.ch}</b> ▶`;
  // Numbers: show N items to count; letters: one picture
  const n = it.n || 1;
  $('pics').innerHTML = Array.from({ length: n }, (_, i) =>
    `<span style="animation-delay:${(i * 0.12).toFixed(2)}s">${it.pic}</span>`).join('');
  store.set(idxKey(), idx);
  if (sayIt) speak(it.say, 120);
}
function step(d) {
  const L = items().length;
  idx = (idx + d + L) % L;
  sfx.pop();
  showLearn();
}

// ====== PLAY MODE ======
let target = null, locked = false;
function nChoices() { return streak >= 8 ? 4 : streak >= 3 ? 3 : 2; }
function pickTarget() {
  const list = items();
  // Weighted random: missed items come up more; avoid immediate repeat
  const pool = list.filter(it => it !== target);
  const total = pool.reduce((s, it) => s + 1 + (weights[wk(it)] || 0), 0);
  let r = Math.random() * total;
  for (const it of pool) { r -= 1 + (weights[wk(it)] || 0); if (r <= 0) return it; }
  return pool[pool.length - 1];
}
const wk = it => lang + ':' + it.ch;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
// Round variety: letters may be lowercase; prompt may be the symbol, voice only (hidden), or (numbers) the written word
let round = { lower: false, prompt: 'glyph' };
const face = it => round.lower ? it.key : it.ch;
function askLine() { return LANGS[lang].ask(setName === 'abc', target.name, round.lower); }
function pickRound() {
  const abc = setName === 'abc';
  const lower = abc && target.key !== target.ch && Math.random() < 0.5;
  const r = Math.random();
  const prompt = abc ? (r < 0.6 ? 'glyph' : 'voice') : (r < 0.4 ? 'glyph' : r < 0.7 ? 'word' : 'voice');
  return { lower, prompt };
}

function newRound() {
  locked = false;
  target = pickTarget();
  const others = shuffle(items().filter(it => it !== target)).slice(0, nChoices() - 1);
  const opts = shuffle([target, ...others]);
  round = pickRound();
  const shown = round.prompt === 'voice' ? '👂' : round.prompt === 'word' ? target.word : target.ch; // capital in prompt → small-letter rounds match B → b
  $('ask').innerHTML = `🔊 ${LANGS[lang].find} <b>${shown}</b>`;
  const box = $('choices');
  box.className = 'n' + opts.length;
  box.innerHTML = '';
  opts.forEach((it, i) => {
    const b = document.createElement('button');
    b.className = 'bub';
    b.textContent = face(it);
    b.dataset.ch = it.ch;
    b.style.background = `radial-gradient(circle at 35% 30%, hsl(${it.hue},95%,72%), hsl(${it.hue},85%,48%))`;
    b.style.animationDelay = (i * 0.4) + 's';
    b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); choose(it, b); });
    box.appendChild(b);
  });
  speak(askLine(), 250);
}

function choose(it, el) {
  ensureAudio();
  if (locked) return;
  if (it === target) {
    locked = true;
    streak++;
    stars++; store.set('stars', stars); updateStars();
    weights[wk(it)] = Math.max(0, (weights[wk(it)] || 0) - 1); store.set('w', weights);
    if (el) {
      el.classList.add('right');
      const r = el.getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2);
    } else confetti(W / 2, H / 2);
    const big = stars % 10 === 0;
    if (big) {
      sfx.fanfare();
      for (let k = 0; k < 5; k++) setTimeout(() => confetti(Math.random() * W, H * 0.3 + Math.random() * H * 0.3, 60, 12), k * 180);
      speak(`${LANGS[lang].wow(stars)} ${target.name}!`, 100);
    } else {
      sfx.right();
      const cheers = LANGS[lang].cheers;
      speak(`${cheers[Math.random() * cheers.length | 0]} ${target.name}!`, 100);
    }
    setTimeout(newRound, big ? 2600 : 1600);
  } else {
    streak = 0;
    weights[wk(target)] = Math.min(5, (weights[wk(target)] || 0) + 1); store.set('w', weights);
    sfx.wrong();
    if (el) { el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong'); }
    speak(`${LANGS[lang].thats(it.name)} ${askLine()}`, 100);
  }
}
function updateStars() {
  const s = $('stars');
  s.textContent = '⭐ ' + stars;
  s.animate([{ transform: 'scale(1.5)' }, { transform: 'scale(1)' }], { duration: 400 });
}

// ====== MODE / SET SWITCHING ======
function render() {
  $('m-learn').classList.toggle('on', mode === 'learn');
  $('m-play').classList.toggle('on', mode === 'play');
  $('s-abc').classList.toggle('on', setName === 'abc');
  $('s-123').classList.toggle('on', setName === 'num');
  document.querySelectorAll('.flag').forEach(f => f.classList.toggle('on', f.dataset.lang === lang));
  document.documentElement.lang = LANGS[lang].html;
  $('learn').style.display = mode === 'learn' ? 'flex' : 'none';
  $('m-count').classList.toggle('on', mode === 'count');
  $('setgrp').style.visibility = mode === 'count' ? 'hidden' : 'visible';
  $('play').style.display = mode === 'play' ? 'flex' : 'none';
  $('count').style.display = mode === 'count' ? 'block' : 'none';
  $('stage').style.display = mode === 'count' ? 'none' : 'flex';
  $('prev').style.display = $('next').style.display = mode === 'learn' ? 'block' : 'none';
  stopCount();
  if (mode === 'learn') showLearn(started);
  else if (mode === 'play') { target = null; newRound(); }
  else renderCount();
}
// ====== COUNT MODE ======
// One page with 1–10; tap a row to count it aloud item by item (objects or fingers).
let countStyle = store.get('cstyle', 'obj'); // 'obj' | 'hand'
let countTimers = [];
function stopCount() {
  countTimers.forEach(clearTimeout); countTimers = [];
  document.querySelectorAll('.crow.active').forEach(r => r.classList.remove('active'));
  document.querySelectorAll('.lit').forEach(e => e.classList.remove('lit'));
}
function sayNow(text) { // queue a short utterance without cancelling the previous one
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang = voice ? voice.lang : LANGS[lang].tts;
  u.rate = 1; u.pitch = 1.25;
  speechSynthesis.speak(u);
}
// Hand SVG: thumb first (as counted in RO/DE), then index, middle, ring, pinky. raised = how many are up.
const FINGERS = [ // [x, y-top when raised, width, height when raised]
  [4, 44, 14, 34],  // thumb (left side, lower)
  [22, 6, 13, 52], [37, 2, 13, 56], [52, 6, 13, 52], [67, 16, 12, 42]
];
function handSVG(raised) {
  let f = '';
  FINGERS.forEach(([x, y, w, h], i) => {
    const up = i < raised;
    if (i === 0) { // thumb: sticks out at an angle when up, tucked away (hidden) when down
      if (up) f += `<rect class="f cf" x="6" y="30" width="15" height="46" rx="7.5" transform="rotate(-32 14 76)"/>`;
      return;
    }
    const yy = up ? y : 50, hh = up ? h : 12;
    f += `<rect class="f${up ? ' cf' : ''}" x="${x}" y="${yy}" width="${w}" height="${hh + 14}" rx="${w / 2}"/>`;
  });
  return `<svg class="hand" viewBox="-14 0 98 100">${f}<rect class="f" x="18" y="52" width="62" height="44" rx="16"/></svg>`;
}
function renderCount() {
  $('c-obj').classList.toggle('on', countStyle === 'obj');
  $('c-hand').classList.toggle('on', countStyle === 'hand');
  const nums = SETS.num;
  $('crows').innerHTML = nums.map(it => {
    let items;
    if (countStyle === 'obj') items = Array.from({ length: it.n }, () => `<span class="citem cu">${it.pic}</span>`).join('');
    else items = it.n <= 5 ? handSVG(it.n) : handSVG(5) + handSVG(it.n - 5);
    return `<div class="crow" data-n="${it.n}"><div class="cnum" style="color:hsl(${it.hue},90%,65%)">${it.ch}</div>` +
           `<div class="citems">${items}</div><div class="cword">${it.word}</div></div>`;
  }).join('');
  document.querySelectorAll('.crow').forEach(r => r.addEventListener('click', () => { ensureAudio(); countRow(+r.dataset.n); }));
}
const STEP = 750;
// Count one row: highlight + say each item. Returns duration in ms.
function countRow(n, startAt = 0, finale = true) {
  if (startAt === 0) { stopCount(); if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  const row = document.querySelector(`.crow[data-n="${n}"]`);
  if (!row) return 0;
  const units = [...row.querySelectorAll(countStyle === 'obj' ? '.cu' : '.cf')];
  units.forEach(u => u.classList.remove('lit', 'done'));
  const words = LANGS[lang].nums;
  countTimers.push(setTimeout(() => {
    document.querySelectorAll('.crow.active').forEach(r => r.classList.remove('active'));
    row.classList.add('active');
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, startAt));
  units.forEach((u, i) => countTimers.push(setTimeout(() => {
    units.forEach(x => x.classList.remove('lit'));
    u.classList.add('lit', 'done');
    sayNow(words[i]); sfx.pop();
  }, startAt + 300 + i * STEP)));
  const end = startAt + 300 + n * STEP;
  if (finale) countTimers.push(setTimeout(() => {
    units.forEach(x => x.classList.remove('lit'));
    const r = row.querySelector('.cnum').getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height / 2, 30, 7);
    sfx.right();
    sayNow(`${words[n - 1]}!`);
  }, end));
  return end + (finale ? 900 : 0);
}
// Count all rows 1→10: one number per row ("one", "two", …) — not counting each row from one.
function countAll() {
  stopCount(); if ('speechSynthesis' in window) speechSynthesis.cancel();
  const words = LANGS[lang].nums;
  document.querySelectorAll('.citem,.f').forEach(e => e.classList.remove('done'));
  words.forEach((w, i) => countTimers.push(setTimeout(() => {
    const row = document.querySelector(`.crow[data-n="${i + 1}"]`);
    document.querySelectorAll('.crow.active').forEach(r => r.classList.remove('active'));
    row.classList.add('active');
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    row.querySelectorAll('.cu,.cf').forEach(e => e.classList.add('done'));
    sayNow(w); sfx.pop();
  }, i * 1000)));
  countTimers.push(setTimeout(() => { sfx.fanfare(); confetti(W / 2, H / 2, 80, 12); }, words.length * 1000));
}

function setMode(m) { mode = m; store.set('mode', m); streak = 0; sfx.pop(); render(); }
function setSet(s) { setName = s; store.set('set', s); loadIdx(); target = null; streak = 0; sfx.pop(); render(); }
function setLang(l) {
  lang = l; store.set('lang', l); SETS = buildSets(l); pickVoice();
  loadIdx(); target = null; streak = 0; sfx.pop(); render();
}
document.querySelectorAll('.flag').forEach(f =>
  f.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); firstTouch(); setLang(f.dataset.lang); }));

// First interaction unlocks audio + speech (browser autoplay rules)
let started = false;
function firstTouch() {
  if (started) return;
  started = true;
  ensureAudio();
}
addEventListener('pointerdown', firstTouch, true);
addEventListener('keydown', firstTouch, true);

function tapBtn(id, fn) {
  $(id).addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); firstTouch(); fn(); });
}
tapBtn('m-learn', () => setMode('learn'));
tapBtn('m-play', () => setMode('play'));
tapBtn('m-count', () => setMode('count'));
tapBtn('c-obj', () => { countStyle = 'obj'; store.set('cstyle', 'obj'); stopCount(); sfx.pop(); renderCount(); });
tapBtn('c-hand', () => { countStyle = 'hand'; store.set('cstyle', 'hand'); stopCount(); sfx.pop(); renderCount(); });
tapBtn('c-all', () => countAll());
tapBtn('s-abc', () => setSet('abc'));
tapBtn('s-123', () => setSet('num'));
tapBtn('prev', () => step(-1));
tapBtn('next', () => step(1));
$('glyph').addEventListener('pointerdown', e => { e.stopPropagation(); showLearn(); sfx.pop(); confetti(e.clientX, e.clientY, 18, 6); });
$('ask').addEventListener('pointerdown', e => { e.stopPropagation(); speak(askLine()); });

// Swipe left/right in learn mode
let sx = null;
$('stage').addEventListener('pointerdown', e => { sx = e.clientX; });
$('stage').addEventListener('pointerup', e => {
  if (sx == null || mode !== 'learn') return;
  const dx = e.clientX - sx; sx = null;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
});

// Keyboard: type a letter/digit → it shows up (learn) or counts as an answer (play)
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowright') { if (mode === 'learn') step(1); return; }
  if (k === 'arrowleft')  { if (mode === 'learn') step(-1); return; }
  if (e.repeat) return;
  const isLetter = /^\p{L}$/u.test(k), isDigit = /^[0-9]$/.test(k);
  if (mode === 'count') {
    if (isDigit) { ensureAudio(); countRow(k === '0' ? 10 : +k); }
    else if (k === ' ' || k === 'enter') { e.preventDefault(); ensureAudio(); countAll(); }
    return;
  }
  if (!isLetter && !isDigit) {
    if (k === ' ' || k === 'enter') { e.preventDefault(); if (mode === 'learn') step(1); else speak(askLine()); }
    return;
  }
  const want = isLetter ? 'abc' : 'num';
  if (!SETS[want].some(it => it.key === k)) return; // letter not in this language's alphabet
  if (want !== setName) { setSet(want); if (mode === 'play') return; }
  const list = items();
  const i = list.findIndex(it => it.key === k);
  if (i < 0) return;
  if (mode === 'learn') { idx = i; sfx.pop(); showLearn(); confetti(W / 2, H / 2, 24, 7); }
  else {
    const btn = [...document.querySelectorAll('.bub')].find(b => b.dataset.ch === list[i].ch);
    choose(list[i], btn || null);
  }
});
addEventListener('contextmenu', e => e.preventDefault());

render();

// ====== PWA ======
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
}
(function () {
  const bar = $('install-bar'), btn = $('install-btn'), msg = $('install-msg'), dismiss = $('dismiss-btn');
  let deferred = null;
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) return;
  try { if (sessionStorage.getItem('install-dismissed')) return; } catch (e) {}
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    msg.textContent = 'Install ABC 123! on your device';
    bar.style.display = 'flex';
  });
  if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
    setTimeout(() => {
      if (deferred) return;
      msg.innerHTML = 'Tap <strong>Share</strong> then <strong>Add to Home Screen</strong>';
      btn.style.display = 'none'; bar.style.display = 'flex';
    }, 1500);
  }
  bar.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('click', () => {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(() => { deferred = null; bar.style.display = 'none'; });
  });
  dismiss.addEventListener('click', () => {
    bar.style.display = 'none';
    try { sessionStorage.setItem('install-dismissed', '1'); } catch (e) {}
  });
  addEventListener('appinstalled', () => { bar.style.display = 'none'; });
})();
</script>
</body>
</html>
